name: fixshop_shared
description: Shared business logic, entities, repositories, and theme for the FixShop ecosystem.
version: 1.0.0

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.12.1
  cloud_firestore: ^6.5.0
  firebase_auth: ^6.5.2
  firebase_storage: ^13.4.2

  # Functional programming
  dartz: ^0.10.1
  equatable: ^2.0.5

  # Utilities
  uuid: ^4.4.0
  intl: ^0.20.2

  # Theme tokens
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  fake_cloud_firestore: ^4.4.0
